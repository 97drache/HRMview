# 매일 인원 스냅샷 갱신 → main 푸시 → Vercel 자동 재배포
#
# 필수 시크릿 (둘 중 하나):
#   HRDATA_REPO + HRDATA_REPO_TOKEN — 비공개 저장소에 HRdata.xlsx만 둔 경우
#     예: HRDATA_REPO=97drache/HRM-data  (저장소 루트에 HRdata.xlsx)
#   HRDATA_DOWNLOAD_URL — 엑셀 직접 다운로드 URL (SharePoint/OneDrive 공유 링크 등)
#
# 수동 실행: GitHub → Actions → Daily headcount snapshot → Run workflow

name: Daily headcount snapshot

on:
  schedule:
    # 06:00 KST (UTC 21:00, 전날)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-headcount-snapshot
  cancel-in-progress: false

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch HRdata.xlsx
        env:
          HRDATA_REPO: ${{ secrets.HRDATA_REPO }}
          HRDATA_REPO_TOKEN: ${{ secrets.HRDATA_REPO_TOKEN }}
          HRDATA_DOWNLOAD_URL: ${{ secrets.HRDATA_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          mkdir -p data

          if [ -f data/HRdata.xlsx ]; then
            echo "data/HRdata.xlsx already present"
            exit 0
          fi

          if [ -n "${HRDATA_DOWNLOAD_URL:-}" ]; then
            echo "Downloading from HRDATA_DOWNLOAD_URL..."
            curl -fsSL -L "$HRDATA_DOWNLOAD_URL" -o data/HRdata.xlsx
          elif [ -n "${HRDATA_REPO:-}" ] && [ -n "${HRDATA_REPO_TOKEN:-}" ]; then
            echo "Cloning data repo ${HRDATA_REPO}..."
            git clone --depth 1 "https://x-access-token:${HRDATA_REPO_TOKEN}@github.com/${HRDATA_REPO}.git" /tmp/hrm-hrdata
            if [ -f /tmp/hrm-hrdata/HRdata.xlsx ]; then
              cp /tmp/hrm-hrdata/HRdata.xlsx data/HRdata.xlsx
            elif [ -f /tmp/hrm-hrdata/data/HRdata.xlsx ]; then
              cp /tmp/hrm-hrdata/data/HRdata.xlsx data/HRdata.xlsx
            else
              echo "::error::HRdata.xlsx not found in data repo (root or data/)"
              exit 1
            fi
          else
            echo "::error::Set GitHub secrets: HRDATA_REPO + HRDATA_REPO_TOKEN, or HRDATA_DOWNLOAD_URL"
            exit 1
          fi

          ls -la data/HRdata.xlsx

      - name: Export public snapshot
        env:
          TZ: Asia/Seoul
        run: npm run export:headcount-public

      - name: Verify snapshot is not empty
        run: |
          node -e "
          const fs=require('fs');
          const p='headcount-web/public/headcount-snapshot.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if (j.empty) {
            console.error('Snapshot is empty — check HRdata.xlsx');
            process.exit(1);
          }
          console.log('baseDate', j.baseDate, 'jobGender rows', (j.jobGender||[]).length);
          "

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headcount-web/public/headcount-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to snapshot — skip commit"
            exit 0
          fi
          git commit -m "chore(headcount): daily snapshot $(date -u +%Y-%m-%d)"
          git push
